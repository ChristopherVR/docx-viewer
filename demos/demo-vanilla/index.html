<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DOCX Viewer | Document editor</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23185abd'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E"
		/>
	</head>
	<body>
		<section id="landing" class="landing" aria-labelledby="landing-title">
			<div
				id="dropzone"
				class="dropzone"
				tabindex="0"
				role="button"
				aria-describedby="landing-note"
			>
				<span class="landing-badge" aria-hidden="true">W</span>
				<p id="landing-title" class="landing-title">
					Drop a .docx or .doc file here or click to browse
				</p>
				<p id="landing-note" class="landing-note">The file is processed entirely in the browser</p>
				<div class="landing-actions">
					<button id="browse" class="landing-primary" type="button">Browse files</button>
					<button id="blank" type="button">or create a New Document</button>
				</div>
				<button id="sample" class="landing-link" type="button">Open the sample document</button>
				<input id="landing-file" type="file" accept=".docx,.doc" hidden />
			</div>
			<p id="landing-error" class="landing-error" role="alert" hidden></p>
		</section>
		<main id="workspace" class="workspace" hidden>
			<div id="editor"></div>
		</main>
		<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
		<nav class="floating-controls" aria-label="Demo options">
			<a href="./collaboration.html">Coauthoring demo</a>
			<button
				id="theme-toggle"
				class="theme-toggle"
				type="button"
				aria-label="Switch to dark theme"
				aria-pressed="false"
			>
				Dark
			</button>
			<span id="build-stamp" class="build-stamp"></span>
		</nav>
		<script type="module" src="./src.ts"></script>
	</body>
</html>
