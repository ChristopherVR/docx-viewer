name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Check out ooxml-core (private, pinned revision)
        env:
          OOXML_CORE_TOKEN: ${{ secrets.OOXML_CORE_TOKEN }}
          OOXML_CORE_REF: b0b83d4c6bb598defda3d81b0c5dd2e21d5ff8b9
        run: |
          git clone "https://x-access-token:${OOXML_CORE_TOKEN}@github.com/ChristopherVR/ooxml-core.git" ../ooxml-core
          git -C ../ooxml-core checkout "$OOXML_CORE_REF"
          (cd ../ooxml-core && bun install --frozen-lockfile && bun run build)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:packages
      - run: bun run pack:smoke
      - run: bun run check:shared
