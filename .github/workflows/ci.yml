name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  # No paths-ignore on pull requests: `ci-success` is a required check, and a required check that
  # never reports (because every path was ignored) blocks the merge.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Release machinery: planner, publish guards, commit and changelog checks.
      - run: bun run test:scripts
      - run: bun run check:changelog
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:packages
      - run: bun run pack:smoke
      - run: bun run check:shared

  # The single check the `main` ruleset requires. Funnelling through one job keeps branch
  # protection stable when jobs are added or renamed (a required check that no longer exists blocks
  # every PR silently). `always()` plus the explicit result test is deliberate: without it a
  # cancelled or skipped dependency would let this pass.
  ci-success:
    name: ci-success
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check every required job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            case "$result" in
              success) ;;
              *)
                echo "::error::A required CI job did not succeed (got: $results)."
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs succeeded."
