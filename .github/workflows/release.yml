name: Release npm packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:packages
      - run: bun run pack:smoke
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: node scripts/release.mjs --check "$RELEASE_VERSION"
      - name: Publish in dependency order
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs --publish "$RELEASE_VERSION"
      - name: Create GitHub release with npm artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT_DIR="$RUNNER_TEMP/npm-release"
          mkdir -p "$ARTIFACT_DIR"
          for PACKAGE in core legacy document web-component bindings viewer; do
            npm pack "https://registry.npmjs.org/@christophervr/docx-$PACKAGE/-/docx-$PACKAGE-$VERSION.tgz" --ignore-scripts --pack-destination "$ARTIFACT_DIR"
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            FLAGS=()
            [[ "$VERSION" != *-* ]] || FLAGS+=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --title "Word viewer $VERSION" --generate-notes "${FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" "$ARTIFACT_DIR"/*.tgz --clobber
