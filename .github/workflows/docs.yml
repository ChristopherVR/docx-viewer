name: Deploy Docs and Demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'demos/**'
      - 'packages/**'
      - 'scripts/build-pages.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out ooxml-core (private, pinned revision)
        env:
          OOXML_CORE_TOKEN: ${{ secrets.OOXML_CORE_TOKEN }}
          OOXML_CORE_REF: 239a61d1955d7cab38457aa0e31c54cc6bcce5be
        run: |
          git clone "https://x-access-token:${OOXML_CORE_TOKEN}@github.com/ChristopherVR/ooxml-core.git" ../ooxml-core
          git -C ../ooxml-core checkout "$OOXML_CORE_REF"
          (cd ../ooxml-core && bun install --frozen-lockfile && bun run build)
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install documentation dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build:packages
      - name: Build Pages site and demos
        run: bun run docs:build
        working-directory: docs
      - name: Configure Pages
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_PAGES == 'true'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event.repository.private == false || vars.ENABLE_PRIVATE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
